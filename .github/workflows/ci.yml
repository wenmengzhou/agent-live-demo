name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: demo-app checks (unit, deploy to test, E2E)
        working-directory: demo-app
        run: npm run verify
      - name: eval tasks fail on the baseline and pass with their reference solutions
        run: node eval/run.js --self-test
